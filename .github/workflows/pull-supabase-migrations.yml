name: Pull JDV CRM Supabase migrations

on:
  workflow_dispatch:

jobs:
  db-pull:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Verify Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          }

          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing SUPABASE_DB_PASSWORD"
            exit 1
          }

      - name: Link JDV CRM Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref arxhppptxeeyeexkdyjv \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Pull exact remote database schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db pull --linked

      - name: Commit migrations to GitHub
        run: |
          git config user.name "JDV CRM Migration Bot"
          git config user.email "actions@users.noreply.github.com"

          git add supabase/migrations supabase/config.toml

          if git diff --cached --quiet; then
            echo "No migration changes detected."
          else
            git commit -m "chore: pull exact JDV CRM Supabase migrations"
            git push
          fi
