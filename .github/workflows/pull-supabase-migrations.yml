name: Pull JDV CRM Supabase migrations

on:
  workflow_dispatch:

jobs:
  db-pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Link JDV CRM Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref arxhppptxeeyeexkdyjv --password "$SUPABASE_DB_PASSWORD"

      - name: Pull exact remote migration
        run: |
          supabase db pull --linked --yes

      - name: Pull managed schemas when supported
        continue-on-error: true
        run: |
          supabase db pull --linked --schema auth,storage --yes

      - name: Commit exact migrations
        run: |
          git config user.name "JDV CRM Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations supabase/config.toml
          if git diff --cached --quiet; then
            echo "No migration changes detected."
          else
            git commit -m "chore: pull exact JDV CRM Supabase migrations"
            git push
          fi
